<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Habit tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>

label{display:block;font-size:14px;color:var(--mut);margin-top:12px}input,select,textarea{width:100%;display:block;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-top:4px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.chips,.sw{display:flex;gap:6px;margin-top:6px}.chips button{flex:1;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}.chips .on{background:var(--acc);color:var(--on)}
.sw button{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid transparent}.sw .on{border-color:var(--ink)}
.tabs .add.hide{display:none}
button{transition:transform .12s,background .2s}button:active{transform:scale(.94)}
.td .tx{flex:1;padding:8px 0;overflow-wrap:anywhere}.td.dn .tx{text-decoration:line-through;color:var(--mut)}.td.dn{opacity:.7}.td .chk.d{color:var(--on)}.x{font-size:26px;color:var(--mut);width:44px;height:44px}

.tabs{gap:4px}.tabs button{font-size:15px;padding:0 4px}

.sh{margin:26px 0 2px}.sh span{font-weight:400}
.td .tx{text-align:left}.late{display:block;font-size:13px;color:#D9622B}.dh{margin:14px 0 0;font-weight:600}
.nav button{display:grid;place-items:center;width:48px;height:48px;border:1px solid var(--line);font-size:0}svg{display:block}
.num{width:72px;text-align:center;font-weight:800;font-size:20px;padding:8px 4px;margin:0;border-radius:10px;background:transparent;border-color:transparent}.num:focus{background:var(--bg);border-color:var(--line)}.note{display:block;font-style:italic;overflow-wrap:anywhere}

.bgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.bg{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px;opacity:.55}.bg.on{opacity:1}.bg .em{font-size:30px;filter:grayscale(1)}.bg.on .em{filter:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.hd .btn{height:40px;padding:0 14px;font-size:14px;white-space:nowrap}
#jr{margin-top:8px;min-height:120px;resize:vertical}
</style></head><body>
<main id="app"></main>
<nav class="tabs"><button id="t1" onclick="show('today')">Today</button><button id="t3" onclick="show('todo')">To-do</button><button id="t4" onclick="show('goals')">Goals</button><button class="add" id="fab" onclick="plus()" aria-label="Add">+</button><button id="t2" onclick="show('stats')">Stats</button></nav>

</div></div>
<div class="ov" id="nt_o" hidden><div class="sheet"><h2 id="n_h">Note</h2><textarea id="n_t" rows="4" maxlength="300" placeholder="How did it go?"></textarea><div class="acts"><button class="btn" onclick="saveNote()">Save</button><button class="btn g" onclick="closeAll()">Cancel</button></div></div></div>
<div class="ov" id="gl" hidden><div class="sheet"><h2 id="g_h">New goal</h2><label>Goal<input id="g_t" maxlength="80" placeholder="e.g. Run a half marathon"></label><label>Target date (optional)<input id="g_d" type="date"></label><label>Milestones, one per line (optional)<textarea id="g_m" rows="5" placeholder="Run 5k"></textarea></label><div class="acts"><button class="btn" onclick="saveGoal()">Save goal</button><button class="btn g" onclick="closeAll()">Cancel</button><button class="btn g" id="g_x" onclick="delGoal()">Delete</button></div></div></div>
<div class="ov" id="td" hidden><div class="sheet"><h2 id="td_h">New to-do</h2><label>Task<input id="td_t" maxlength="80" placeholder="e.g. Book dentist" onkeydown="if(event.key=='Enter')saveTodo()"></label><label>Day<input id="td_d" type="date"></label><div class="chips"><button onclick="qd(0)">Today</button><button onclick="qd(1)">Tomorrow</button><button onclick="qd(7)">Next week</button></div><label>Repeat<select id="td_r"><option value="">Never</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></label><div class="acts"><button class="btn" onclick="saveTodo()">Save</button><button class="btn g" onclick="closeAll()">Cancel</button></div></div></div>
<div class="ov" id="bk" hidden><div class="sheet"><h2>Backup</h2><p class="sm">Copy this text to save your data. To restore, paste a backup here and tap Restore.</p><textarea id="b_t" rows="8"></textarea><div class="acts"><button class="btn" onclick="copyB()">Copy</button><button class="btn g" onclick="restoreB()">Restore</button><button class="btn g" onclick="closeAll()">Close</button></div></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),P=k=>{const[a,b,c]=k.split('-');return new Date(+a,b-1,+c)},add=(k,n)=>{const d=P(k);d.setDate(d.getDate()+n);return key(d)},dow=k=>(P(k).getDay()+6)%7,ws=k=>add(k,-dow(k)),TODAY=key(new Date());
const COLS=['#E4572E','#E3A21A','#2E9E6B','#2F7DE1','#8A5BD6','#D6457F'],DN=['M','T','W','T','F','S','S'];
let S={habits:[],logs:{}},view='today',day=TODAY,sel=null,range='week',editId=null,fcol=COLS[0],fdays=[];
try{const r=JSON.parse(localStorage.getItem('ht')||'null');if(r&&r.habits)S=r}catch(e){}S.skips=S.skips||{};S.todos=S.todos||[];S.goals=S.goals||[];S.notes=S.notes||{};migr();

const act=()=>S.habits.filter(h=>!h.arch),get=id=>S.habits.find(h=>h.id==id);
const v=(h,k)=>(S.logs[h.id]||{})[k]||0,ok=(h,k)=>v(h,k)>=(h.type=='count'?h.target:1),sch=(h,k)=>h.mode!='days'||h.days.includes(dow(k)),skp=(h,k)=>!!(S.skips[h.id]||{})[k],live=(h,k)=>sch(h,k)&&!skp(h,k);

const start=h=>Object.keys(S.logs[h.id]||{}).concat(h.created).sort()[0];
function streak(h){let run=0,best=0;if(h.mode=='weekly'){for(let w=ws(start(h)),cw=ws(TODAY);w<=cw;w=add(w,7)){if(wc(h,w)>=h.n)run++;else if(w<cw)run=0;best=Math.max(best,run)}}
else for(let k=start(h);k<=TODAY;k=add(k,1)){if(!live(h,k))continue;if(ok(h,k))run++;else if(k<TODAY)run=0;best=Math.max(best,run)}return[run,best]}
function rate(h,N){if(h.mode=='weekly'){if(N<=7)return Math.min(1,wc(h,TODAY)/h.n);let m=0;for(let i=0;i<4;i++)if(wc(h,add(TODAY,-7*i))>=h.n)m++;return m/4}
let s=0,d=0;for(let i=0;i<N;i++){const k=add(TODAY,-i);if(k<start(h)||!live(h,k))continue;s++;if(ok(h,k))d++}return s?d/s:0}
function row(h){const[c]=streak(h),x=v(h,day),n=h.type=='count',d=ok(h,day);if(skp(h,day))return `<div class="row" style="--c:${h.color};opacity:.65"><button class="nm" onclick="detail('${h.id}')"><b>${E(h.name)}</b><span class="sub"><span>Skipped</span></span></button><button class="btn g" onclick="skip('${h.id}')">Undo skip</button></div>`;
const parts=[n?`${x}/${h.target} ${E(h.unit||'')}`:'',h.mode=='weekly'?`${wc(h,day)}/${h.n} this week`:'',c?`${c} ${h.mode=='weekly'?'week':'day'} streak`:'',h.mode!='weekly'&&!d?`<button class="sk" onclick="skip('${h.id}')">Skip</button>`:''].filter(Boolean);
return `<div class="row" data-i="${h.id}" style="--c:${h.color}"><button class="nm" onclick="detail('${h.id}')"><b>${E(h.name)}</b><span class="sub">${parts.map(p=>`<span>${p}</span>`).join('')}</span></button>`+(n?`<div class="cnt"><button onclick="bump('${h.id}',-1)" aria-label="Less">−</button><input class="num ${d?'d':''}" type="number" inputmode="numeric" min="0" value="${x}" aria-label="Amount" onchange="setv('${h.id}',this.value)"><button onclick="bump('${h.id}',1)" aria-label="More">+</button></div>`:`<button class="chk ${d?'d':''}" onclick="bump('${h.id}',${d?-1:1})" aria-label="Toggle done">✓</button>`)+`</div>`}
function todayV(){const hs=act().filter(h=>sch(h,day)),lv=hs.filter(h=>!skp(h,day)),d=lv.filter(h=>ok(h,day)).length,D=P(day);
return `<div class="nav"><button onclick="go(-1)" aria-label="Previous day">${IC('M15 5l-7 7 7 7')}</button><div><h1>${day==TODAY?'Today':D.toLocaleDateString('en-GB',{weekday:'long'})}</h1><p class="sm">${D.toLocaleDateString('en-GB',{day:'numeric',month:'long'})}</p></div><button onclick="go(1)" ${day>=TODAY?'disabled':''} aria-label="Next day">${IC('M9 5l7 7-7 7')}</button></div><div class="bar"><i data-w="${lv.length?d/lv.length*100:0}"></i></div><p class="sm">${d} of ${lv.length} done</p>`+(hs.length?hs.map(row).join(''):`<p class="empty">No habits scheduled. Tap + to add one.</p>`)+jrn()}
const days=(n,o=0)=>Array.from({length:n},(_,i)=>add(TODAY,-o-i));
function comp(ks){let s=0,d=0;for(const k of ks)for(const h of act())if(h.mode!='weekly'&&live(h,k)&&k>=start(h)){s++;if(ok(h,k))d++}return s?d/s:null}
function ins(){const a=comp(days(7)),b=comp(days(7,7)),N=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],e=[0,1,2,3,4,5,6].map(w=>[comp(days(91).filter(k=>dow(k)==w)),w]).filter(x=>x[0]!==null).sort((x,y)=>y[0]-x[0]);let h='';const B='<b style="font-size:20px">';
if(a!==null&&b!==null){const d=Math.round((a-b)*100);h+=`<div class="card">${B}${d>0?'+':''}${d} pts</b><span class="sm">vs previous 7 days</span></div>`}
if(e.length>1){const t=e[e.length-1];h+=`<div class="card">${B}${N[e[0][1]]}</b><span class="sm">best day, ${Math.round(e[0][0]*100)}%</span></div><div class="card">${B}${N[t[1]]}</b><span class="sm">toughest, ${Math.round(t[0]*100)}%</span></div>`}
return h?`<div class="cards">${h}</div>`:''}
function statsV(){const N=range=='week'?7:30,ds=[];for(let i=N-1;i>=0;i--)ds.push(add(TODAY,-i));
const pc=ds.map(k=>{const hs=act().filter(h=>h.mode!='weekly'&&live(h,k)&&k>=start(h));return hs.length?hs.filter(h=>ok(h,k)).length/hs.length:null}),f=pc.filter(x=>x!==null),avg=f.length?Math.round(f.reduce((a,b)=>a+b,0)/f.length*100):0;
return `<div class="hd"><h1>Stats</h1><button class="btn g" onclick="show('review')">Weekly review</button></div><div class="seg"><button class="${range=='week'?'on':''}" onclick="rng('week')">Week</button><button class="${range=='month'?'on':''}" onclick="rng('month')">Month</button></div><p class="sm">Average daily completion: <b>${avg}%</b></p>${ins()}${sum()}
<div class="chart">${pc.map((p,i)=>`<div class="col" title="${ds[i]}"><div class="t"><i style="height:${(p||0)*100}%"></i></div><span>${N==7?DN[dow(ds[i])]:(i%7==0?P(ds[i]).getDate():'')}</span></div>`).join('')}</div>
<h2>By habit</h2>`+(act().length?act().map(h=>{const r=Math.round(rate(h,N)*100),st=streak(h);return `<div class="rt" style="--c:${h.color}"><div><span>${E(h.name)}</span><b>${r}%</b></div><p class="sm">Streak ${st[0]}, best ${st[1]} ${h.mode=='weekly'?'weeks':'days'}</p><div class="bar"><i style="width:${r}%"></i></div></div>`}).join(''):`<p class="empty">Add a habit to see stats.</p>`)+tdStats()+gStats()+bgH()+`<div class="acts"><button class="btn g" onclick="openB()">Backup / restore</button></div>`}
function detV(){const h=get(sel);if(!h){view='today';return todayV()}const[c,b]=streak(h),u=h.mode=='weekly'?'wks':'days',s=add(ws(TODAY),-112);let cells='';
for(let i=0;i<119;i++){const k=add(s,i);if(k>TODAY){cells+='<i class="x"></i>';continue}const a=h.type=='count'?Math.min(1,v(h,k)/h.target):(ok(h,k)?1:0);cells+=a?`<i class="on" style="opacity:${.3+.7*a}" title="${k}"></i>`:`<i class="${live(h,k)?'':'u'}" title="${k}"></i>`}

return `<button class="btn g" onclick="show('today')" style="display:inline-flex;align-items:center;gap:6px">${IC('M15 5l-7 7 7 7')}Back</button><h1 style="margin-top:16px;color:${h.color}">${E(h.name)}</h1><p class="sm">${sc}${h.type=='count'?`, target ${h.target} ${E(h.unit||'')}`:''}</p>
<div class="cards"><div class="card"><b>${c}</b><span class="sm">streak (${u})</span></div><div class="card"><b>${b}</b><span class="sm">best (${u})</span></div><div class="card"><b>${Math.round(rate(h,30)*100)}%</b><span class="sm">last 30 days</span></div></div>
<h2>Last 17 weeks</h2><div class="heat" style="--c:${h.color}">${cells}</div>
<div class="acts"><button class="btn" onclick="openForm('${h.id}')">Edit</button><button class="btn g" onclick="arch('${h.id}')">Archive</button><button class="btn g" onclick="del('${h.id}')">Delete</button></div>`}
function draw(){$('#app').innerHTML=view=='stats'?statsV():view=='detail'?detV():view=='todo'?todoW():view=='goals'?goalsV():view=='review'?reviewV():todayV();$('#t1').className=view=='today'||view=='detail'?'on':'';$('#t2').className=view=='stats'||view=='review'?'on':'';$('#t3').className=view=='todo'?'on':'';$('#t4').className=view=='goals'?'on':'';$('#fab').classList.toggle('hide',view=='stats'||view=='review');const b=document.querySelector('.bar i[data-w]');if(b){const w=+b.dataset.w;b.style.width=lastW+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{b.style.width=w+'%';lastW=w}))}checkBadges()}
